# Runs every test on GitHub each time someone pushes or opens a pull request.
# Green tick = all tests pass. Red cross = open "Details" to see which task failed.
name: tests

on:
  push:
    branches: [main]   # after a merge
  pull_request:        # on every pull request, before it is merged

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
